# Render Blueprint: creates the API (from the backend Dockerfile) and a PostgreSQL database.
services:
  - type: web
    name: paper-trading-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paper-trading-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false   # set to your Vercel URL, e.g. https://paper-trading.vercel.app

databases:
  - name: paper-trading-db
    plan: free
